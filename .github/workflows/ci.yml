name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.25"

jobs:
  # Fast feedback: compile and unit-test every module. No native libraries,
  # no containers.
  unit:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      - name: Vet
        run: make vet

      - name: Unit tests
        run: make test

  # The contract stage is deliberately separate: it is slower (it pulls the
  # Pact FFI) and it is the gate that stops a service from shipping a change
  # its collaborators cannot handle.
  contracts:
    name: Pact contract tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/go.sum"

      - name: Install Pact FFI
        run: |
          cd services/appointment-service
          go run github.com/pact-foundation/pact-go/v2 install --libDir /tmp/pact
          echo "LD_LIBRARY_PATH=/tmp/pact" >> "$GITHUB_ENV"

      # Consumers run first: they are what *generates* the contracts, from
      # the real client code exercising a mock provider.
      - name: Consumer contracts
        run: make pact-consumer

      # Providers then replay every recorded interaction against their real
      # handlers. A field rename on either side fails here.
      - name: Provider verification
        env:
          GIT_COMMIT: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}
        run: make pact-provider

      - name: Upload generated pacts
        uses: actions/upload-artifact@v4
        with:
          name: pacts
          path: pacts/
          if-no-files-found: error

  # Publishing only happens for trunk builds, and only once the contracts are
  # green — the broker should never hold a pact that failed verification.
  publish-pacts:
    name: Publish to Pact Broker
    runs-on: ubuntu-latest
    needs: contracts
    if: github.ref == 'refs/heads/main' && vars.PACT_BROKER_BASE_URL != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pacts
          path: pacts

      - name: Publish
        env:
          PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: |
          docker run --rm \
            -v "$PWD/pacts:/pacts" \
            -e PACT_BROKER_BASE_URL \
            -e PACT_BROKER_TOKEN \
            pactfoundation/pact-cli:latest \
            publish /pacts \
              --consumer-app-version "${{ github.sha }}" \
              --branch "${{ github.ref_name }}"

  # Proves the compose stack actually builds; catches Dockerfile drift that
  # unit tests never would.
  images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      matrix:
        service:
          - gateway
          - services/auth-service
          - services/doctor-service
          - services/patient-service
          - services/appointment-service
          - services/notification-service
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
